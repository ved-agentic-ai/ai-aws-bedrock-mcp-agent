<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="awsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9900"/>
      <stop offset="100%" stop-color="#FF5500"/>
    </linearGradient>

    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>

    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#7E22CE"/>
    </linearGradient>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38BDF8"/>
    </marker>
    
    <marker id="arrow-mcp" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22D3EE"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="620" fill="url(#awsBg)" rx="12" stroke="#30363d" stroke-width="2"/>

  <!-- TITLE BAR -->
  <rect x="30" y="25" width="940" height="65" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="50" y="55" fill="#FF9900" font-size="20" font-weight="800" letter-spacing="0.5">AWS ARCHITECTURE DIAGRAM</text>
  <text x="50" y="75" fill="#8b949e" font-size="12" font-weight="500">Enterprise Agentic AI Control Center with Bedrock, MCP &amp; Serverless Infrastructure</text>
  
  <rect x="830" y="42" width="125" height="30" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="892" y="61" fill="#38BDF8" font-size="11" font-weight="700" text-anchor="middle">AWS 2026 Spec</text>

  <!-- AWS REGION BOUNDARY -->
  <rect x="180" y="115" width="790" height="475" rx="12" fill="none" stroke="#FF9900" stroke-width="2" stroke-dasharray="6,6"/>
  <rect x="200" y="105" width="180" height="22" rx="4" fill="#FF9900"/>
  <text x="290" y="120" fill="#000" font-size="11" font-weight="800" text-anchor="middle">AWS REGION (us-east-1)</text>

  <!-- VPC / SERVERLESS SUBNET BOUNDARY -->
  <rect x="200" y="145" width="750" height="430" rx="10" fill="#161b22" fill-opacity="0.6" stroke="#30363d" stroke-width="1.5"/>
  <text x="220" y="168" fill="#8b949e" font-size="11" font-weight="700">AWS SERVERLESS ENVIRONMENT</text>

  <!-- 1. CLIENT APPLICATION -->
  <g transform="translate(30, 290)">
    <rect width="120" height="110" rx="10" fill="#21262d" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="60" cy="40" r="20" fill="url(#blueGrad)"/>
    <text x="60" y="46" fill="#fff" font-size="18" text-anchor="middle">💻</text>
    <text x="60" y="78" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">Web Control</text>
    <text x="60" y="93" fill="#8b949e" font-size="10" text-anchor="middle">Center (UI)</text>
  </g>

  <!-- 2. AMAZON API GATEWAY -->
  <g transform="translate(230, 290)">
    <rect width="130" height="110" rx="10" fill="#21262d" stroke="#A855F7" stroke-width="2"/>
    <rect x="45" y="20" width="40" height="40" rx="8" fill="url(#purpleGrad)"/>
    <text x="65" y="45" fill="#fff" font-size="20" text-anchor="middle">📡</text>
    <text x="65" y="78" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">API Gateway</text>
    <text x="65" y="93" fill="#A855F7" font-size="10" font-weight="600" text-anchor="middle">REST Endpoint</text>
  </g>

  <!-- 3. AWS LAMBDA AGENT RUNTIME -->
  <g transform="translate(420, 290)">
    <rect width="150" height="110" rx="10" fill="#21262d" stroke="#FF9900" stroke-width="2"/>
    <rect x="55" y="20" width="40" height="40" rx="8" fill="url(#orangeGrad)"/>
    <text x="75" y="45" fill="#fff" font-size="20" text-anchor="middle">⚡</text>
    <text x="75" y="78" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">Lambda Agent</text>
    <text x="75" y="93" fill="#FF9900" font-size="10" font-weight="600" text-anchor="middle">AgentRuntime Engine</text>
  </g>

  <!-- 4. AMAZON BEDROCK -->
  <g transform="translate(420, 170)">
    <rect width="150" height="90" rx="10" fill="#21262d" stroke="#EC4899" stroke-width="2"/>
    <rect x="55" y="15" width="40" height="35" rx="8" fill="url(#pinkGrad)"/>
    <text x="75" y="38" fill="#fff" font-size="18" text-anchor="middle">🧠</text>
    <text x="75" y="65" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">Amazon Bedrock</text>
    <text x="75" y="78" fill="#EC4899" font-size="10" font-weight="600" text-anchor="middle">Nova Micro LLM</text>
  </g>

  <!-- 5. MCP TOOL SERVER LAMBDA -->
  <g transform="translate(640, 290)">
    <rect width="140" height="110" rx="10" fill="#21262d" stroke="#22D3EE" stroke-width="2"/>
    <rect x="50" y="20" width="40" height="40" rx="8" fill="url(#cyanGrad)"/>
    <text x="70" y="45" fill="#fff" font-size="20" text-anchor="middle">🔌</text>
    <text x="70" y="78" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">MCP Tool Server</text>
    <text x="70" y="93" fill="#22D3EE" font-size="10" font-weight="600" text-anchor="middle">Lambda Protocol</text>
  </g>

  <!-- 6. AMAZON DYNAMODB -->
  <g transform="translate(820, 290)">
    <rect width="110" height="110" rx="10" fill="#21262d" stroke="#38BDF8" stroke-width="2"/>
    <rect x="35" y="20" width="40" height="40" rx="8" fill="url(#blueGrad)"/>
    <text x="55" y="45" fill="#fff" font-size="20" text-anchor="middle">💾</text>
    <text x="55" y="78" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">DynamoDB</text>
    <text x="55" y="93" fill="#38BDF8" font-size="10" font-weight="600" text-anchor="middle">Session Memory</text>
  </g>

  <!-- 7. AMAZON S3 KNOWLEDGE BUCKET -->
  <g transform="translate(640, 440)">
    <rect width="140" height="90" rx="10" fill="#21262d" stroke="#10B981" stroke-width="2"/>
    <text x="70" y="40" fill="#fff" font-size="22" text-anchor="middle">🪣</text>
    <text x="70" y="62" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">Amazon S3</text>
    <text x="70" y="77" fill="#10B981" font-size="10" font-weight="600" text-anchor="middle">Knowledge Base</text>
  </g>

  <!-- CONNECTORS / ARROWS -->
  <!-- Client to API Gateway -->
  <path d="M 150 345 L 230 345" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arrow)"/>
  
  <!-- API Gateway to AgentRuntime -->
  <path d="M 360 345 L 420 345" stroke="#A855F7" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- AgentRuntime to Bedrock (Up & Down Converse Loop) -->
  <path d="M 470 290 L 470 260" stroke="#EC4899" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 520 260 L 520 290" stroke="#EC4899" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="500" y="278" fill="#EC4899" font-size="9" font-weight="700" text-anchor="middle">Converse API</text>

  <!-- AgentRuntime to MCP Tool Server -->
  <path d="M 570 345 L 640 345" stroke="#22D3EE" stroke-width="2.5" stroke-dasharray="5,5" marker-end="url(#arrow-mcp)"/>
  <text x="605" y="335" fill="#22D3EE" font-size="9" font-weight="700" text-anchor="middle">JSON-RPC</text>

  <!-- MCP Server to DynamoDB -->
  <path d="M 780 345 L 820 345" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- MCP Server to S3 -->
  <path d="M 710 400 L 710 440" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow)"/>

</svg>
